{% extends "base.html" %}
{% block title %}Register | CampusRooms{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4"><div class="brand-icon">CR</div><h2 class="fw-bold mt-3">Create account</h2><p class="text-muted">Student registration</p></div>
    <form method="post">
      <label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
      <label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required>
      <label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" minlength="8" required>
      <button class="btn btn-primary w-100 py-2">Create account</button>
    </form>
    <p class="text-center mt-3 mb-0 text-muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
