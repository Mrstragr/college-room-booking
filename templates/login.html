{% extends "base.html" %}
{% block title %}Login | CampusRooms{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4"><div class="brand-icon">CR</div><h2 class="fw-bold mt-3">Welcome back</h2><p class="text-muted">Sign in to book a campus room</p></div>
    <form method="post">
      <label class="form-label">Email address</label>
      <input class="form-control mb-3" type="email" name="email" required placeholder="you@college.edu">
      <label class="form-label">Password</label>
      <input class="form-control mb-4" type="password" name="password" required placeholder="Your password">
      <button class="btn btn-primary w-100 py-2">Sign in</button>
    </form>
    <p class="text-center mt-3 mb-0 text-muted">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
